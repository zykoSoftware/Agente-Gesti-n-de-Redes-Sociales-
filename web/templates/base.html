<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agente de Redes{% endblock %}</title>
  <style>
    :root {
      --bg:#0E1116; --surface:#161B22; --surface2:#1E2530; --line:#2A3440;
      --ink:#F2F5F8; --muted:#9AA6B2; --accent:#C6FF3A; --accent-ink:#0E1116;
      --danger:#FF5A4D; --ok:#3ED598; --warn:#FFB93A;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.55; }
    a { color:var(--accent); text-decoration:none; }
    .wrap { max-width:1080px; margin:0 auto; padding:0 24px; }
    header.top { border-bottom:1px solid var(--line); padding:20px 0; position:sticky; top:0;
      background:rgba(14,17,22,.9); backdrop-filter:blur(8px); z-index:10; }
    .top .wrap { display:flex; align-items:center; justify-content:space-between; }
    .logo-mark { font-weight:900; letter-spacing:.04em; font-size:20px; }
    .logo-mark .dot { color:var(--accent); }
    .eyebrow { font-family:ui-monospace,Menlo,monospace; font-size:12px; letter-spacing:.18em;
      text-transform:uppercase; color:var(--accent); font-weight:700; }
    h1 { font-size:34px; font-weight:800; letter-spacing:-.02em; margin:8px 0 4px; }
    h2 { font-size:22px; font-weight:700; letter-spacing:-.01em; margin:0 0 14px; }
    .sub { color:var(--muted); margin:0; }
    main { padding:32px 0 80px; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px; }
    .btn { display:inline-flex; align-items:center; gap:8px; background:var(--accent);
      color:var(--accent-ink); border:none; border-radius:10px; padding:11px 18px; font-size:15px;
      font-weight:700; cursor:pointer; font-family:inherit; }
    .btn:hover { filter:brightness(1.08); }
    .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
    .btn.danger { background:transparent; color:var(--danger); border:1px solid var(--danger)55; }
    .btn.sm { padding:7px 12px; font-size:13px; }
    input, select { width:100%; background:var(--surface2); border:1px solid var(--line);
      color:var(--ink); border-radius:10px; padding:11px 13px; font-size:15px; font-family:inherit; }
    input::placeholder { color:var(--muted); }
    label { display:block; font-size:13px; color:var(--muted); margin:0 0 6px; font-weight:600; }
    .field { margin-bottom:14px; }
    .flash { padding:12px 16px; border-radius:10px; margin-bottom:12px; font-size:14px; font-weight:600; }
    .flash.ok { background:#12291F; color:var(--ok); border:1px solid #1E7A54; }
    .flash.error { background:#2A1210; color:var(--danger); border:1px solid #7A2A24; }
    .flash.warn { background:#2A2410; color:var(--warn); border:1px solid #7A6524; }
    .grid { display:grid; gap:16px; }
    .swatch { width:44px; height:44px; border-radius:10px; border:1px solid var(--line); }
    .mono { font-family:ui-monospace,Menlo,monospace; }
    .muted { color:var(--muted); }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .tag { display:inline-block; background:var(--surface2); border:1px solid var(--line);
      border-radius:100px; padding:4px 12px; font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a href="{{ url_for('index') }}" class="logo-mark">Agente de Redes<span class="dot">.</span></a>
      <span class="eyebrow">Panel de contenido</span>
    </div>
  </header>
  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
